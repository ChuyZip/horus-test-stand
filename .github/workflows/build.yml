name: Build Executables (Windows & macOS)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean HorusSpaceLab.spec

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HorusSpaceLab-Windows-x64
          path: dist/HorusSpaceLab/

  build-macos:
    name: Build macOS (.app)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean HorusSpaceLab.spec

      - name: Zip macOS App Bundle
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent HorusSpaceLab.app HorusSpaceLab-macOS.zip

      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HorusSpaceLab-macOS-arm64
          path: dist/HorusSpaceLab-macOS.zip
