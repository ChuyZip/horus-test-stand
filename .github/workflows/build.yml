name: Build Executables (Windows, macOS & Linux)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean HorusSpaceLab.spec

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HorusSpaceLab-Windows-x64
          path: dist/HorusSpaceLab/

  build-macos:
    name: Build macOS (.app)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean HorusSpaceLab.spec

      - name: Zip macOS App Bundle
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent HorusSpaceLab.app HorusSpaceLab-macOS.zip

      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HorusSpaceLab-macOS-arm64
          path: dist/HorusSpaceLab-macOS.zip

  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system libraries for Qt6 / PySide6
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libfontconfig1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean HorusSpaceLab.spec

      - name: Package as .tar.gz preserving executable permissions
        run: |
          cd dist
          tar -czvf HorusSpaceLab-Linux-x64.tar.gz HorusSpaceLab

      - name: Upload Linux Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HorusSpaceLab-Linux-x64
          path: dist/HorusSpaceLab-Linux-x64.tar.gz
